name: Docker Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: webapi
            dockerfile: src/Web/WebAPI/Dockerfile
          - name: repairorder-worker
            dockerfile: src/Services/RepairOrder/WorkerService/Dockerfile
          - name: scheduling-worker
            dockerfile: src/Services/Scheduling/WorkerService/Dockerfile
          - name: warehouse-worker
            dockerfile: src/Services/Warehouse/WorkerService/Dockerfile
          - name: customer-worker
            dockerfile: src/Services/Customer/WorkerService/Dockerfile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service.dockerfile }}
        push: false
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test image
      run: |
        docker images
        echo "Image built successfully: ${{ matrix.service.name }}"
